<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Adsterra Statistics</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f4f6f8;
  margin:0;
  padding:20px;
  color:#222;
}
.container{
  max-width:1000px;
  margin:auto;
}
h1{margin-bottom:20px}
.filters{
  background:white;
  padding:18px;
  border-radius:12px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
input,button{
  padding:11px;
  border-radius:7px;
  border:1px solid #ddd;
}
button{
  background:#111;
  color:white;
  cursor:pointer;
  border:0;
}
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}
.card{
  background:white;
  padding:18px;
  border-radius:12px;
}
.card small{color:#777}
.card strong{
  display:block;
  font-size:22px;
  margin-top:8px;
}
.table-box{
  background:white;
  border-radius:12px;
  overflow:auto;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
}
.error{
  background:#ffe5e5;
  color:#b00000;
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

@media(max-width:700px){
  .cards{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<div class="container">

<h1>Adsterra Statistics</h1>

<div class="filters">
  <label>
    Dari<br>
    <input type="date" id="startDate">
  </label>

  <label>
    Sampai<br>
    <input type="date" id="finishDate">
  </label>

  <button onclick="loadStats()">CEK STATISTIK</button>
</div>

<div id="error" class="error"></div>

<div class="cards">
  <div class="card">
    <small>Total Revenue</small>
    <strong id="revenue">$0.00</strong>
  </div>

  <div class="card">
    <small>Impressions</small>
    <strong id="impressions">0</strong>
  </div>

  <div class="card">
    <small>Clicks</small>
    <strong id="clicks">0</strong>
  </div>

  <div class="card">
    <small>CTR</small>
    <strong id="ctr">0%</strong>
  </div>
</div>

<div class="table-box">
<table>
<thead>
<tr>
  <th>Placement / Sub ID</th>
  <th>Revenue</th>
  <th>Impressions</th>
  <th>Clicks</th>
  <th>CTR</th>
</tr>
</thead>

<tbody id="tableBody">
<tr>
  <td colspan="5">Pilih tanggal lalu tekan CEK STATISTIK</td>
</tr>
</tbody>

</table>
</div>

</div>

<script>

const WORKER_URL =
"https://adstera-api.deniapriliana10.workers.dev/";

const startInput = document.getElementById("startDate");
const finishInput = document.getElementById("finishDate");

const today = new Date();
const weekAgo = new Date();
weekAgo.setDate(today.getDate() - 6);

function formatDate(date){
  return date.toISOString().split("T")[0];
}

startInput.value = formatDate(weekAgo);
finishInput.value = formatDate(today);


async function loadStats(){

  const start = startInput.value;
  const finish = finishInput.value;

  const errorBox = document.getElementById("error");

  errorBox.style.display = "none";

  if(!start || !finish){
    errorBox.textContent = "Silakan pilih tanggal terlebih dahulu.";
    errorBox.style.display = "block";
    return;
  }

  document.getElementById("tableBody").innerHTML =
    "<tr><td colspan='5'>Mengambil data...</td></tr>";

  try{

    const url =
      WORKER_URL +
      "?start_date=" +
      encodeURIComponent(start) +
      "&finish_date=" +
      encodeURIComponent(finish);

    const response = await fetch(url);

    const data = await response.json();

    if(!response.ok){
      throw new Error(
        data.error || data.message || "Gagal mengambil data"
      );
    }

    renderStats(data);

  }catch(error){

    console.error(error);

    errorBox.textContent =
      "Gagal mengambil data: " + error.message;

    errorBox.style.display = "block";

    document.getElementById("tableBody").innerHTML =
      "<tr><td colspan='5'>Tidak ada data</td></tr>";
  }
}


function renderStats(data){

  /*
   * Adsterra biasanya mengembalikan data
   * dalam property 'items'.
   */

  const rows =
    Array.isArray(data) ? data :
    Array.isArray(data.items) ? data.items :
    Array.isArray(data.data) ? data.data :
    [];

  let totalRevenue = 0;
  let totalImpressions = 0;
  let totalClicks = 0;

  const tbody = document.getElementById("tableBody");

  tbody.innerHTML = "";

  if(rows.length === 0){

    tbody.innerHTML =
      "<tr><td colspan='5'>Data kosong</td></tr>";

  }else{

    rows.forEach(row => {

      const revenue =
        Number(row.revenue ?? row.sum_revenue ?? 0);

      const impressions =
        Number(row.impressions ?? 0);

      const clicks =
        Number(row.clicks ?? 0);

      const ctr =
        impressions > 0
        ? (clicks / impressions) * 100
        : 0;

      totalRevenue += revenue;
      totalImpressions += impressions;
      totalClicks += clicks;

      const name =
        row.placement_sub_id ??
        row.placement ??
        row.sub_id ??
        "-";

      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${name}</td>
        <td>$${revenue.toFixed(4)}</td>
        <td>${impressions.toLocaleString()}</td>
        <td>${clicks.toLocaleString()}</td>
        <td>${ctr.toFixed(2)}%</td>
      `;

      tbody.appendChild(tr);
    });
  }

  const totalCtr =
    totalImpressions > 0
    ? (totalClicks / totalImpressions) * 100
    : 0;

  document.getElementById("revenue").textContent =
    "$" + totalRevenue.toFixed(4);

  document.getElementById("impressions").textContent =
    totalImpressions.toLocaleString();

  document.getElementById("clicks").textContent =
    totalClicks.toLocaleString();

  document.getElementById("ctr").textContent =
    totalCtr.toFixed(2) + "%";
}

</script>

</body>
</html>
