<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adsterra Statistics</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  color: #222;
}

.header {
  background: #111827;
  color: white;
  padding: 20px;
}

.header h1 {
  margin: 0;
  font-size: 24px;
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px;
}

.filter {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.filter-grid {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
}

label {
  font-size: 13px;
  font-weight: bold;
  display: block;
  margin-bottom: 6px;
}

input {
  width: 100%;
  padding: 11px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 15px;
}

button {
  border: 0;
  background: #2563eb;
  color: white;
  padding: 11px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  align-self: end;
}

button:hover {
  background: #1d4ed8;
}

.cards {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.card-title {
  font-size: 13px;
  color: #666;
  margin-bottom: 8px;
}

.card-value {
  font-size: 22px;
  font-weight: bold;
}

.section {
  background: white;
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.section h2 {
  margin-top: 0;
  font-size: 19px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 700px;
}

th,
td {
  padding: 11px;
  border-bottom: 1px solid #eee;
  text-align: left;
  font-size: 14px;
}

th {
  background: #f8fafc;
}

.number {
  text-align: right;
}

.status {
  margin-top: 12px;
  font-size: 14px;
}

.error {
  color: #dc2626;
}

.loading {
  color: #2563eb;
}

.empty {
  color: #777;
}

@media (max-width: 800px) {

  .filter-grid {
    grid-template-columns: 1fr;
  }

  button {
    width: 100%;
  }

  .cards {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 450px) {

  .cards {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="container">
    <h1>Adsterra Statistics</h1>
  </div>
</div>

<div class="container">

  <div class="filter">

    <div class="filter-grid">

      <div>
        <label>Dari tanggal</label>
        <input type="date" id="startDate">
      </div>

      <div>
        <label>Sampai tanggal</label>
        <input type="date" id="finishDate">
      </div>

      <button onclick="loadStatistics()">
        CEK STATISTIK
      </button>

    </div>

    <div id="status" class="status"></div>

  </div>


  <!-- TOTAL -->

  <div class="cards">

    <div class="card">
      <div class="card-title">Total Revenue</div>
      <div class="card-value" id="totalRevenue">$0.000</div>
    </div>

    <div class="card">
      <div class="card-title">Impressions</div>
      <div class="card-value" id="totalImpression">0</div>
    </div>

    <div class="card">
      <div class="card-title">Clicks</div>
      <div class="card-value" id="totalClicks">0</div>
    </div>

    <div class="card">
      <div class="card-title">CTR</div>
      <div class="card-value" id="totalCTR">0%</div>
    </div>

    <div class="card">
      <div class="card-title">CPM</div>
      <div class="card-value" id="totalCPM">$0.000</div>
    </div>

  </div>


  <!-- DAILY -->

  <div class="section">

    <h2>STATISTIK HARIAN</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Tanggal</th>
            <th class="number">Impressions</th>
            <th class="number">Clicks</th>
            <th class="number">CTR</th>
            <th class="number">CPM</th>
            <th class="number">Revenue</th>
          </tr>
        </thead>

        <tbody id="dailyTable">
        </tbody>

      </table>

    </div>

  </div>


  <!-- PLACEMENT -->

  <div class="section">

    <h2>DIRECT / PLACEMENT</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Placement</th>
            <th class="number">Impressions</th>
            <th class="number">Clicks</th>
            <th class="number">CTR</th>
            <th class="number">CPM</th>
            <th class="number">Revenue</th>
          </tr>
        </thead>

        <tbody id="placementTable">
        </tbody>

      </table>

    </div>

  </div>


  <!-- SUB ID -->

  <div class="section">

    <h2>SMARTLINK / SUB-ID</h2>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>Sub-ID</th>
            <th class="number">Impressions</th>
            <th class="number">Clicks</th>
            <th class="number">CTR</th>
            <th class="number">CPM</th>
            <th class="number">Revenue</th>
          </tr>
        </thead>

        <tbody id="subidTable">
        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

const WORKER_URL =
"https://adstera-api.deniapriliana10.workers.dev/";


const startInput =
document.getElementById("startDate");

const finishInput =
document.getElementById("finishDate");


// Default tanggal
const today =
new Date();

const year =
today.getFullYear();

const month =
String(today.getMonth() + 1).padStart(2, "0");

const day =
String(today.getDate()).padStart(2, "0");

const todayString =
`${year}-${month}-${day}`;

startInput.value =
todayString;

finishInput.value =
todayString;


function money(value) {

  return "$" +
    Number(value || 0).toFixed(3);

}


function number(value) {

  return Number(value || 0)
    .toLocaleString("en-US");

}


function percent(value) {

  return Number(value || 0)
    .toFixed(2) + "%";

}


function getRows(data) {

  if (Array.isArray(data)) {
    return data;
  }

  if (Array.isArray(data.items)) {
    return data.items;
  }

  if (Array.isArray(data.data)) {
    return data.data;
  }

  return [];

}


function getImpression(row) {

  return Number(
    row.impression ??
    row.impressions ??
    0
  );

}


function getClicks(row) {

  return Number(
    row.clicks ?? 0
  );

}


function getCTR(row) {

  return Number(
    row.ctr ?? 0
  );

}


function getCPM(row) {

  return Number(
    row.cpm ?? 0
  );

}


function getRevenue(row) {

  return Number(
    row.revenue ?? 0
  );

}


function getName(row, type) {

  if (type === "date") {

    return (
      row.date ??
      row.day ??
      row.datetime ??
      "-"
    );

  }

  if (type === "placement") {

    return (
      row.placement ??
      row.placement_name ??
      row.placement_id ??
      "-"
    );

  }

  if (type === "subid") {

    return (
      row.placement_sub_id ??
      "-"
    );

  }

  return "-";

}


function createRow(row, type) {

  const tr =
  document.createElement("tr");

  tr.innerHTML = `

    <td>
      ${getName(row, type)}
    </td>

    <td class="number">
      ${number(getImpression(row))}
    </td>

    <td class="number">
      ${number(getClicks(row))}
    </td>

    <td class="number">
      ${percent(getCTR(row))}
    </td>

    <td class="number">
      ${money(getCPM(row))}
    </td>

    <td class="number">
      ${money(getRevenue(row))}
    </td>

  `;

  return tr;

}


async function getStats(start, finish, group) {

  const url =
    WORKER_URL +
    "?start_date=" +
    encodeURIComponent(start) +
    "&finish_date=" +
    encodeURIComponent(finish) +
    "&group=" +
    encodeURIComponent(group);

  const response =
    await fetch(url);

  if (!response.ok) {

    throw new Error(
      "HTTP " + response.status
    );

  }

  return await response.json();

}


async function loadStatistics() {

  const start =
    startInput.value;

  const finish =
    finishInput.value;

  const status =
    document.getElementById("status");

  if (!start || !finish) {

    status.innerHTML =
      '<span class="error">Tanggal belum lengkap.</span>';

    return;

  }

  status.innerHTML =
    '<span class="loading">Mengambil data Adsterra...</span>';


  try {

    // Ambil 3 laporan
    const dailyData =
      await getStats(
        start,
        finish,
        "date"
      );


    const placementData =
      await getStats(
        start,
        finish,
        "placement"
      );


    const subidData =
      await getStats(
        start,
        finish,
        "subid"
      );


    const dailyRows =
      getRows(dailyData);

    const placementRows =
      getRows(placementData);

    const subidRows =
      getRows(subidData);


    // ==========================
    // TOTAL DARI DATA HARIAN
    // ==========================

    let totalRevenue = 0;
    let totalImpression = 0;
    let totalClicks = 0;

    dailyRows.forEach(row => {

      totalRevenue +=
        getRevenue(row);

      totalImpression +=
        getImpression(row);

      totalClicks +=
        getClicks(row);

    });


    let totalCTR = 0;

    if (totalImpression > 0) {

      totalCTR =
        (totalClicks /
        totalImpression) * 100;

    }


    let totalCPM = 0;

    if (totalImpression > 0) {

      totalCPM =
        (totalRevenue /
        totalImpression) * 1000;

    }


    document.getElementById(
      "totalRevenue"
    ).textContent =
      money(totalRevenue);


    document.getElementById(
      "totalImpression"
    ).textContent =
      number(totalImpression);


    document.getElementById(
      "totalClicks"
    ).textContent =
      number(totalClicks);


    document.getElementById(
      "totalCTR"
    ).textContent =
      percent(totalCTR);


    document.getElementById(
      "totalCPM"
    ).textContent =
      money(totalCPM);


    // ==========================
    // TABLE HARIAN
    // ==========================

    const dailyTable =
      document.getElementById(
        "dailyTable"
      );

    dailyTable.innerHTML = "";


    if (dailyRows.length === 0) {

      dailyTable.innerHTML =
        `<tr>
          <td colspan="6" class="empty">
            Tidak ada data.
          </td>
        </tr>`;

    } else {

      dailyRows.forEach(row => {

        dailyTable.appendChild(
          createRow(row, "date")
        );

      });

    }


    // ==========================
    // TABLE PLACEMENT
    // ==========================

    const placementTable =
      document.getElementById(
        "placementTable"
      );

    placementTable.innerHTML = "";


    if (placementRows.length === 0) {

      placementTable.innerHTML =
        `<tr>
          <td colspan="6" class="empty">
            Tidak ada data placement.
          </td>
        </tr>`;

    } else {

      placementRows.forEach(row => {

        placementTable.appendChild(
          createRow(row, "placement")
        );

      });

    }


    // ==========================
    // TABLE SUB ID
    // ==========================

    const subidTable =
      document.getElementById(
        "subidTable"
      );

    subidTable.innerHTML = "";


    if (subidRows.length === 0) {

      subidTable.innerHTML =
        `<tr>
          <td colspan="6" class="empty">
            Tidak ada data Sub-ID.
          </td>
        </tr>`;

    } else {

      subidRows.forEach(row => {

        subidTable.appendChild(
          createRow(row, "subid")
        );

      });

    }


    status.innerHTML =
      `<span>
        Data berhasil diperbarui.
        Periode ${start} sampai ${finish}
      </span>`;


  } catch (error) {

    console.error(error);

    status.innerHTML =
      `<span class="error">
        Gagal mengambil data:
        ${error.message}
      </span>`;

  }

}


// Otomatis cek ketika halaman dibuka
loadStatistics();

</script>

</body>
</html>
